<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주식매매노트 웹 제작 예제 · Y Labs</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header><span>주식매매노트 <small>by Y Labs</small></span><a href="https://tradingnote.kr/">공식 홈페이지</a></header>
  <main>
    <p class="eyebrow">공개용 학습 예제</p>
    <h1>기록을 월별 차트로 바꾸기</h1>
    <p>운영 앱 백업과 호환되지 않는 축약 예제입니다. 가상 데이터만 사용하세요.</p>
    <div class="actions"><button id="sample">가상 데이터 보기</button><label>연습 JSON 선택 <input id="file" type="file" accept=".json,application/json"></label></div>
    <p id="message" role="status"></p>
    <section id="report" hidden>
      <div class="cards"><article><span>예제 기록</span><strong id="count"></strong></article><article><span>합산 순손익</span><strong id="total"></strong></article></div>
      <article class="panel"><h2>월별 순손익</h2><p>이미 계산된 가상 순손익을 월별로 더합니다.</p><canvas id="chart" aria-label="가상 데이터 월별 순손익 차트"></canvas><ul id="values" aria-label="차트 수치"></ul></article>
    </section>
    <details><summary>연습 JSON 형식</summary><pre>[{"month":"2026-07","netPnl":203},
 {"month":"2026-08","netPnl":-77}]</pre></details>
  </main>
  <footer>© 2026 Y Labs · <a href="mailto:dnfgocks@gmail.com">문의</a></footer>
</body>
</html>
